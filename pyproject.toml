[project]
name = "operation-black-meridian"
version = "0.1.0"
description = "Explainable financial intelligence pipeline for synthetic transaction anomalies, temporal behavior, network exposure, and risk visualization."
requires-python = ">=3.13"
authors = [
    { name = "Valerius VARDA", email = "valeriusvarda@gmail.com" }
]
keywords = [
    "financial-intelligence",
    "anomaly-detection",
    "risk-analytics",
    "network-analysis",
    "synthetic-data",
]

dependencies = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "networkx>=3.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "typer>=0.15",
]

[project.scripts]
black-meridian = "black_meridian.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/black_meridian"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["black_meridian"]

[tool.coverage.report]
show_missing = true
skip_covered = true
